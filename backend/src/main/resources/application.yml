server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: doc-assistant-backend

  datasource:
    url: jdbc:h2:file:./data/docassistant;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash

# Python Microservice Configuration
python:
  service-url: ${PYTHON_SERVICE_URL:http://127.0.0.1:8000}

# Cache Configuration
cache:
  ttl-minutes: 60

# Logging Configuration
logging:
  level:
    root: INFO
    com.docassistant: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:docassistant-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration-ms: 86400000  # 24 hours

